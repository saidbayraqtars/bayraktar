# sbayraktar.com.tr — static export of the portfolio, served by nginx on the
# Neva VPS next to nevaqr.com and neva.technology (separate server_name, those
# files are not touched).
#
# Install (deploy/kurulum.sh does this):
#   /etc/nginx/sites-available/sbayraktar.conf  (+ symlink in sites-enabled)
#   /etc/nginx/snippets/sbayraktar-headers.conf
#   /etc/nginx/snippets/sbayraktar-redirects.conf  (generated, see scripts/nginx-redirects.mjs)
#   /etc/ssl/sbayraktar/origin.pem + origin.key     (Cloudflare Origin CA)
#
# Cloudflare proxies the site (SSL mode Full (strict)), so the origin
# certificate only needs to be trusted by Cloudflare.
#
# nginx 1.24: http2 goes on the listen line; `http2 on;` is not understood.
# add_header trap: a location with its own add_header drops the server-level
# ones, so every such location includes the headers snippet again.

server {
    listen 80;
    listen [::]:80;
    server_name sbayraktar.com.tr www.sbayraktar.com.tr;
    return 301 https://www.sbayraktar.com.tr$request_uri;
}

# Bare domain -> www (the canonical host in lib/site.ts).
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sbayraktar.com.tr;

    ssl_certificate     /etc/ssl/sbayraktar/origin.pem;
    ssl_certificate_key /etc/ssl/sbayraktar/origin.key;

    return 301 https://www.sbayraktar.com.tr$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.sbayraktar.com.tr;

    ssl_certificate     /etc/ssl/sbayraktar/origin.pem;
    ssl_certificate_key /etc/ssl/sbayraktar/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /var/www/sbayraktar;
    charset utf-8;

    access_log /var/log/nginx/sbayraktar-access.log;
    error_log  /var/log/nginx/sbayraktar-error.log warn;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json
               application/xml image/svg+xml application/manifest+json;

    include snippets/sbayraktar-headers.conf;

    # Old /projects/<slug> URLs from the previous design.
    include snippets/sbayraktar-redirects.conf;

    # Clean URLs: /isler -> isler.html, /p/okka -> p/okka.html.
    location / {
        try_files $uri $uri.html $uri/index.html =404;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        include snippets/sbayraktar-headers.conf;
    }

    # Hashed build output never changes under the same name.
    location /_next/static/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include snippets/sbayraktar-headers.conf;
    }

    location ~ ^/(_img|work|fonts)/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=2592000" always;
        include snippets/sbayraktar-headers.conf;
    }

    location /cv/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600" always;
        include snippets/sbayraktar-headers.conf;
    }

    # Metadata images are exported without a file extension.
    location = /apple-icon      { default_type image/png; try_files $uri =404; }
    location = /opengraph-image { default_type image/png; try_files $uri =404; }
    location = /manifest.webmanifest { default_type application/manifest+json; try_files $uri =404; }

    error_page 404 /404.html;
    location = /404.html { internal; }

    location ~ /\. { deny all; }
}
